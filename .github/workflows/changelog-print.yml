name: changelogPrint

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: changelogPrint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'
      - name: gradle caching
        uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew changelogPrint
